<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPAD — Student Progress Diary</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233F">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E4;--card:#FBF8F0;--ink:#23201B;--soft:#5C574C;--line:#DCD3B8;--navy:#16233F;--gold:#C89B3C;--green:#1F6F54;--copper:#A65A2E;--red:#A6402F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);background:var(--navy)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1727;--card:#182340;--ink:#EDE7D6;--soft:#A9B2C4;--line:#2C3A5C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1727;--card:#182340;--ink:#EDE7D6;--soft:#A9B2C4;--line:#2C3A5C;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 'Work Sans',system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:100vh}
header{background:var(--navy);color:#F6F1E4;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:700 22px 'Fraunces',Georgia,serif;margin:0}
header p{margin:0;font-size:13px;color:#BFC6D6}
.bk{background:none;border:1px solid #5b6b8c;color:#F6F1E4;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px}
main{max-width:640px;margin:0 auto;padding:16px 16px 0}
h2{font:600 20px 'Fraunces',Georgia,serif;margin:4px 0 12px}
.top{display:flex;align-items:center;justify-content:space-between}
.pri,.add{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600}
.add{background:var(--gold);color:#23201B}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.row>div{flex:1;min-width:0;overflow-wrap:anywhere}
small{display:block;color:var(--soft);font-size:13px}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;color:#fff;background:var(--soft);border:0;white-space:nowrap}
.g{background:var(--green)}.y{background:var(--gold);color:#23201B}.c{background:var(--copper)}.r{background:var(--red)}
.x{background:none;border:0;color:var(--soft);font-size:22px;line-height:1;padding:4px 6px}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px;display:grid;gap:10px}
label{display:grid;gap:4px;font-size:14px;font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
textarea{min-height:140px;font-size:12px}
.empty,.note{color:var(--soft);padding:18px 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navy);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:#BFC6D6;font:inherit;font-size:12px;padding:10px 0;border-radius:8px}
.seg{display:flex;gap:6px;margin:0 0 12px}.seg button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;font-weight:500}.seg button[aria-current="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
h3{font:600 15px 'Fraunces',Georgia,serif;margin:16px 0 4px;color:var(--soft)}
nav{overflow-x:auto;scrollbar-width:none}nav button{flex:0 0 auto;padding:10px 14px}
.seg button{font-size:13px;padding:9px 2px}
.hb{display:flex;gap:8px}.bd{background:var(--gold);color:#23201B;border-radius:99px;padding:1px 7px;font-size:12px;font-weight:600;margin-left:4px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.ck{background:none;border:0;color:var(--ink);font-size:24px;line-height:1;padding:2px 4px}
.qt{background:var(--card);border:1px dashed var(--gold);border-radius:12px;padding:12px 14px;margin:0 0 12px;text-align:center;font:italic 500 16px/1.4 'Fraunces',Georgia,serif;cursor:pointer}.qt small{font:12px 'Work Sans',system-ui,sans-serif;margin-top:4px}
.calc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px;display:grid;gap:10px}
.pb{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px}
.tools{display:flex;gap:8px;margin:0 0 10px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px}.ni{font-size:20px;line-height:1}
.hero{background:var(--navy);color:#F6F1E4;border-radius:14px;padding:20px;margin:0 0 14px;text-align:center}.hero h2{font-size:34px;margin:0;color:var(--gold)}.hero p{margin:2px 0 8px;font-size:14px;color:#BFC6D6}.hero b{font:italic 600 17px 'Fraunces',Georgia,serif}
.hi{margin:0 0 12px;font-size:18px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 6px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;font-size:12px;color:var(--soft)}.stats b{display:block;font-size:20px;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 10px;color:var(--ink);font:inherit;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:84px}.tile span{font-size:28px;line-height:1}.tile.soon{opacity:.6}.tile em{position:absolute;top:6px;right:8px;font-size:10px;font-style:normal;background:var(--gold);color:#23201B;border-radius:99px;padding:1px 7px}
.hb .bk{padding:7px 10px;font-size:13px}
@media print{header,nav,.tools,.add,.x,.pb,form{display:none!important}:root{padding:0}body{background:#fff!important;color:#000!important;padding:0}.row{background:#fff!important;border-color:#bbb!important;break-inside:avoid}small,.note{color:#333!important}}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 12px}.bar i{display:block;height:100%;background:var(--green)}
nav button[aria-current="true"]{color:#23201B;background:var(--gold);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPAD">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header><div><h1>SPAD</h1><p>Student Progress Diary</p></div><div class="hb"><button class="bk" id="bell" data-a="tab" data-t="alerts">Alerts</button><button class="bk" data-a="tab" data-t="backup">Backup</button><button class="bk" id="trbtn" data-a="tab" data-t="trash" aria-label="Trash">🗑️</button></div></header>
<main id="v"></main>
<nav id="nav"></nav>
<script>
const K='spad.v1',$=s=>document.querySelector(s);
const D0={subjects:[],scores:[],scheme:[],teachers:[],events:[],academic:[],extra:[],periods:[],study:[],mood:[],trash:[],me:{},ach:[],skills:[],acts:[],stuff:[],todo:[],bands:null,schools:[]};
let S;try{S=Object.assign({},D0,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=Object.assign({},D0)}
S.trash=(S.trash||[]).filter(t=>Date.now()-t.at<2592e6);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const G=[[75,'A1','g'],[70,'B2','g'],[65,'B3','g'],[60,'C4','y'],[55,'C5','y'],[50,'C6','y'],[45,'D7','c'],[40,'E8','c'],[0,'F9','r']];
const seed=()=>{S.bands=[[75,100,'A',1,'Excellent'],[70,74,'B',2,'Very good'],[65,69,'B',3,'Good'],[60,64,'C',4,'Credit'],[55,59,'C',5,'Credit'],[50,54,'C',6,'Credit'],[45,49,'D',7,'Pass'],[40,44,'E',8,'Pass'],[0,39,'F',9,'Fail']].map(([min,max,letter,num,remark])=>({id:uid(),min,max,letter,num:String(num),remark}))};
if(!S.bands)seed();
const lbl=b=>b.letter+(b.num&&b.num!=='None'?b.num:'');
const grade=p=>{if(!S.bands)seed();const r=Math.round(p),b=S.bands.find(b=>r>=b.min&&r<=b.max);return b?[b.min,lbl(b),({A:'g',B:'g',C:'y',D:'c',E:'c',F:'r'})[b.letter]||'']:[0,'-','']};
const pct=x=>x.max>0?x.score/x.max*100:0;
const avg=n=>{const a=S.scores.filter(x=>x.subject===n);return a.length?a.reduce((t,x)=>t+pct(x),0)/a.length:null};
const TYPES=['Classwork','Homework','Assignment','Project','Practical','Quiz','CA 1','CA 2','Examination','Exam correction'];
const ST=['Pending','Covered','Complete'],STC={Pending:'',Covered:'y',Complete:'g'};
const subj=()=>S.subjects.map(s=>s.name);
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'No date';
const SEC={
subjects:{n:'Subjects',t:'Subjects & targets',e:'Add your subjects and set a target percentage for each one.',
 f:[['name','Subject','text'],['target','Target (%)','number',0,70]],
 row:s=>{const a=avg(s.name),k=a===null?null:a>=s.target?['g','On target']:a>=s.target-5?['y','Slightly below']:['r','Below target'];
  return `<div><b>${esc(s.name)}</b><small>Target ${s.target}%${a===null?' · no scores yet':' · average '+a.toFixed(0)+'% ('+grade(a)[1]+')'}</small></div>`+(k?`<span class="chip ${k[0]}">${k[1]}</span>`:'')}},
scores:{n:'Scores',t:'Results',e:'Add a score and SPAD works out the grade for you.',
 s:(a,b)=>(b.date||'').localeCompare(a.date||''),
 f:[['subject','Subject','select',subj],['type','Type','select',()=>TYPES],['score','Score','number'],['max','Out of','number',0,100],['date','Date','date',0,'today']],
 row:x=>{const g=grade(pct(x));return `<div><b>${esc(x.subject)}</b><small>${esc(x.type)} · ${fmt(x.date)} · ${x.score}/${x.max}</small></div><span class="chip ${g[2]}">${g[1]}</span>`}},
scheme:{n:'Scheme',t:'Scheme of work',e:'Add the topics your teachers cover. Tap a status to move it along.',
 f:[['subject','Subject','select',subj],['topic','Topic','text'],['teacher','Teacher (optional)','text'],['resource','Resource (optional)','text']],d:{status:'Pending'},
 row:x=>`<div><b>${esc(x.topic)}</b><small>${esc(x.subject)}${x.teacher?' · '+esc(x.teacher):''}${x.resource?' · '+esc(x.resource):''}</small></div><button class="chip ${STC[x.status]}" data-a="cyc" data-id="${x.id}">${x.status}</button>`},
teachers:{n:'Teachers',t:'People (teachers)',e:'Keep your teachers’ details here.',
 f:[['name','Name','text'],['subject','Subject (optional)','text'],['phone','Phone (optional)','tel'],['email','Email (optional)','email']],
 row:x=>`<div><b>${esc(x.name)}</b><small>${[x.subject,x.phone,x.email].filter(Boolean).map(esc).join(' · ')||'No details yet'}</small></div>`},
events:{n:'Calendar',t:'Trips & events',e:'Add holidays, exams, excursions and school events.',
 s:(a,b)=>(a.date||'').localeCompare(b.date||''),
 f:[['title','Event','text'],['date','Date','date',0,'today'],['kind','Kind','select',()=>['School event','Holiday','Exam','Excursion','Other']]],
 row:x=>{const n=Math.round((new Date(x.date+'T00:00')-new Date().setHours(0,0,0,0))/864e5);
  return `<div><b>${esc(x.title)}</b><small>${esc(x.kind)} · ${fmt(x.date)}</small></div>`+(n>=0?`<span class="chip ${n<=7?'y':''}">${n===0?'Today':n===1?'Tomorrow':'In '+n+' days'}</span>`:'')}}
};
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const tm=x=>x.start?x.start+(x.end?'–'+x.end:''):'No time set';
Object.assign(SEC,{
academic:{t:'Academic timetable',e:'Add your lessons for each school day. Pick the day, the period and the subject.',days:DAYS.slice(0,5),s:(a,b)=>a.period-b.period,
 f:[['day','Day','select',()=>DAYS.slice(0,5)],['period','Period','select',()=>S.periods.map(p=>p.n)],['subject','Subject','select',subj]],
 row:x=>`<div><b>Period ${x.period} · ${esc(x.subject)}</b><small>${ptm(x)}</small></div>`},
extra:{t:'Extracurricular timetable',e:'Add sports, clubs and skills you are learning, on any day of the week.',days:DAYS,s:(a,b)=>(a.start||'').localeCompare(b.start||''),
 f:[['day','Day','select',()=>DAYS],['activity','Activity or skill','text'],['kind','Kind','select',()=>['Skill I’m learning','Sport','Club','Other']],['learning','What I’m learning (optional)','text'],['start','Starts (optional)','time'],['end','Ends (optional)','time']],
 row:x=>`<div><b>${esc(x.activity)}</b><small>${esc(x.kind)}${x.learning?' · '+esc(x.learning):''} · ${tm(x)}</small></div>`}});
const SD=['Planned','Done'];
const ptm=x=>{const p=S.periods.find(p=>p.n==x.period);return p?p.start+'–'+p.end:tm(x)};
const MOOD={Happy:'😊',Excited:'🤩',Proud:'😌',Calm:'😇',Confident:'😎',Grateful:'🙏',Hopeful:'🌤️',Motivated:'💪',Sad:'😢',Angry:'😠',Anxious:'😟',Tired:'😴',Frustrated:'😤',Lonely:'😔',Bored:'🥱',Overwhelmed:'🌀'};
const TR=[['neatness','Neatness','laying out your uniform and books the night before'],['politeness','Politeness','greeting at least three people each morning'],['punctuality','Punctuality','setting your alarm 10 minutes earlier'],['kindness','Kindness','helping a classmate with one small thing']];
Object.assign(SEC,{
periods:{t:'Period times',e:'Set each period’s time once, for example Period 1 from 08:00 to 08:40. Lessons then fill in the times for you.',s:(a,b)=>a.n-b.n,
 f:[['n','Period number','number'],['start','Starts','time'],['end','Ends','time']],
 row:p=>`<div><b>Period ${p.n}</b><small>${p.start}–${p.end}</small></div>`},
study:{t:'Study plan',e:'Plan your study sessions for the week. Tap a session when you finish it.',days:DAYS,s:(a,b)=>(a.start||'').localeCompare(b.start||''),d:{status:'Planned'},
 f:[['day','Day','select',()=>DAYS,DAYS[(new Date().getDay()+6)%7]],['subject','Subject','select',subj],['goal','What will you study? (optional)','text'],['start','Starts (optional)','time'],['end','Ends (optional)','time']],
 sum:it=>{const d=it.filter(x=>x.status==='Done').length;return `<p class="note" style="padding:0 0 8px">${d} of ${it.length} sessions done</p><div class="bar"><i style="width:${d/it.length*100}%"></i></div>`},
 row:x=>`<div><b>${esc(x.subject)}</b><small>${x.goal?esc(x.goal)+' · ':''}${tm(x)}</small></div><button class="chip ${x.status==='Done'?'g':''}" data-a="cyc" data-k="study" data-id="${x.id}">${x.status}</button>`},
mood:{t:'My Diary (behaviour & mood)',e:'Log how your day went. Rate yourself from 1 to 5 and pick how you feel.',s:(a,b)=>(b.date||'').localeCompare(a.date||''),
 f:[['date','Date','date',0,'today']].concat(TR.map(t=>[t[0],t[1]+' (1–5)','select',()=>['5','4','3','2','1'],'3']),[['mood','How are you feeling?','select',()=>Object.keys(MOOD)],['note','Note (optional)','text']]),
 row:x=>{const v=TR.map(t=>Number(x[t[0]])),a=v.reduce((p,q)=>p+q,0)/4,g=a>=4.5?['A','g']:a>=3.5?['B','y']:['C','c'],i=v.indexOf(Math.min(...v)),tip=v[i]<=2?`<small>Try ${TR[i][2]}.</small>`:'';
  return `<div><b>${MOOD[x.mood]||''} ${esc(x.mood)}</b><small>${fmt(x.date)} · ${TR.map((t,j)=>t[1]+' '+v[j]).join(' · ')}${x.note?' · '+esc(x.note):''}</small>${tip}</div><span class="chip ${g[1]}">${g[0]}</span>`}}});
const ld=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function alerts(){
 const a=[],td=ld(),dn=DAYS[(new Date().getDay()+6)%7];
 S.subjects.forEach(s=>{const v=avg(s.name);if(v===null||v>=s.target)return;const g=s.target-v>5;a.push({c:g?'r':'y',o:g?0:1,t:s.name+(g?' is below target':' is slightly below target'),s:`Average ${v.toFixed(0)}% · target ${s.target}%`})});
 S.events.forEach(e=>{const n=Math.round((new Date(e.date+'T00:00')-new Date().setHours(0,0,0,0))/864e5);if(n>=0&&n<=7)a.push({c:n<=1?'r':'y',o:2,t:`${e.title} ${n===0?'is today':n===1?'is tomorrow':'is in '+n+' days'}`,s:`${e.kind} · ${fmt(e.date)}`})});
 S.todo.forEach(x=>{if(x.done||!x.due)return;const n=Math.round((new Date(x.due+'T00:00')-new Date().setHours(0,0,0,0))/864e5),r=RD[x.rem];if(n<0||(r>=0&&n<=r))a.push({c:n<=1?'r':'y',o:1,t:`${x.task} is ${n<0?'overdue':n===0?'due today':n===1?'due tomorrow':'due in '+n+' days'}`,s:jn(x.cat,x.time)})});
 S.stuff.forEach(x=>{if(!x.ret||!/Borrowed|Lent/.test(x.status))return;const n=Math.round((new Date(x.ret+'T00:00')-new Date().setHours(0,0,0,0))/864e5),w=n<0?'(overdue)':n===0?'today':'in '+n+(n===1?' day':' days');if(n<=3)a.push({c:n<0?'r':'y',o:2,t:x.status==='Borrowed'?`Return ${x.item}${x.who?' to '+x.who:''} ${w}`:`${x.item}${x.who?' lent to '+x.who:''} is due back ${w}`,s:'Return by '+fmt(x.ret)})});
 const L=S.academic.filter(x=>x.day===dn).sort((p,q)=>p.period-q.period);
 if(L.length)a.push({c:'g',o:3,t:`${L.length} lesson${L.length>1?'s':''} today`,s:L.map(x=>`P${x.period} ${x.subject}`).join(', ')});
 const P=S.study.filter(x=>x.day===dn&&x.status!=='Done');
 if(P.length)a.push({c:'y',o:3,t:`${P.length} study session${P.length>1?'s':''} to do today`,s:P.map(x=>x.subject).join(', ')});
 if(!S.mood.some(x=>x.date===td))a.push({c:'y',o:4,t:'Log today’s behaviour and mood',s:'It takes a minute. Open My Diary.'});
 return a.sort((p,q)=>p.o-q.o)}
const subs={timetable:[['academic','Academic'],['extra','Extracurricular'],['periods','Periods']],skills:[['skills','Skills'],['acts','Activities']]};
const jn=(...a)=>a.filter(Boolean).map(esc).join(' · ');
const PF=[['name','Full name','text'],['alias','Aliases or nickname','text'],['dob','Date of birth','date'],['gender','Gender','select',['Prefer not to say','Female','Male']],['cls','Class','text'],['lin','LIN (Learner ID)','text'],['nin','NIN (National ID)','password'],['country','Country','text','Nigeria'],['state','State of origin','text'],['rstate','Residential state','text'],['gname','Parent or guardian','text'],['gphone','Guardian phone','tel']];
function prof(){
 const m=S.me||{},age=m.dob?Math.floor((Date.now()-new Date(m.dob))/315576e5):-1;
 $('#v').innerHTML='<h2>My Profile</h2>'+(m.name?`<div class="row"><div><b>${esc(m.name)}${m.alias?' ('+esc(m.alias)+')':''}</b><small>${jn(age>=0?age+' years':'',m.cls,(curSchool()||{}).name||m.school)}</small></div></div>`:'')+'<form id="pf">'+PF.map(([k,l,t,o,d])=>`<label>${l}`+(t==='select'?`<select name="${k}">${o.map(v=>`<option${m[k]===v?' selected':''}>${v}</option>`).join('')}</select>`:`<input name="${k}" type="${t}" autocomplete="off" value="${esc(m[k]!=null?m[k]:(d||''))}"${k==='name'?' required':''}>`)+'</label>').join('')+'<button class="pri">Save profile</button></form><p class="note">Your school details come from My School. Your profile stays on this device and is never included in Share, Print or PDF. A Backup does include it, so keep that text private.</p>'}
Object.assign(SEC,{
ach:{t:'Achievements',e:'Add awards, certificates and wins. Every achievement counts.',s:(a,b)=>(b.date||'').localeCompare(a.date||''),
 f:[['title','Achievement','text'],['kind','Type','select',()=>['Award','Certificate','Competition','Sports','Leadership','Academic','Other']],['event','Event or competition (optional)','text'],['pos','Position or prize (optional)','text'],['cls','Class (optional)','text'],['by','Awarded by (optional)','text'],['date','Date','date',0,'today']],

 else if(a==='del'){const k=dk(),x=S[k].find(x=>x.id===id);if(x){S.trash.unshift({id:uid(),k,at:Date.now(),item:x});S[k]=S[k].filter(y=>y.id!==id);save();render()}}
 else if(a==='rest'){const t=S.trash.find(t=>t.id===id);if(t){S[t.k].push(t.item);S.trash=S.trash.filter(y=>y.id!==id);save();render()}}
 else if(a==='purge'){if(confirm('Delete forever? This cannot be undone.')){S.trash=S.trash.filter(y=>y.id!==id);save();render()}}
 else if(a==='empty'){if(confirm('Empty the Trash? This cannot be undone.')){S.trash=[];save();render()}}
 else if(a==='print'){try{window.print()}catch(e){alert('Printing isn’t available here. Use the PDF button, then print the PDF.')}}
 else if(a==='share'){share(dk())}
 else if(a==='seed'){if(confirm('Replace your scale with the standard A1–F9 scale?')){seed();save();render()}}
 else if(a==='go'){tab=b.dataset.t;if(b.dataset.s)sub=b.dataset.s;open=false;render();scrollTo(0,0)}
 else if(a==='soon'){soonL=b.dataset.l;tab='soon';render();scrollTo(0,0)}
 else if(a==='quote'){QI=pick();render()}
 else if(a==='rshare'){shareText(RT,'Weekly Recap')}
 else if(a==='tg'){const x=S[b.dataset.k].find(x=>x.id===id);const f=b.dataset.f||'fav';x[f]=!x[f];if(b.dataset.k==='schools'&&f==='cur'&&x.cur)S.schools.forEach(y=>{if(y!==x)y.cur=false});save();render()}
 else if(a==='cyc'){const L=b.dataset.k||'scheme',l=L==='study'?SD:ST,x=S[L].find(x=>x.id===id);x.status=l[(l.indexOf(x.status)+1)%l.length];save();render()}
 else if(a==='copy'){const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value)}catch(_){document.execCommand('copy')}b.textContent='Copied'}
 else if(a==='restore'){try{const d=JSON.parse($('#bk').value);if(confirm('Replace everything on this device with this backup?')){S=Object.assign({},D0,d);if(!S.bands)seed();save();tab='subjects';render()}}catch(_){alert('That text isn’t a valid backup. Paste the full text you copied earlier.')}}
});

 if(e.target.id==='pf'){e.preventDefault();const f=new FormData(e.target);S.me=S.me||{};PF.forEach(([k])=>{S.me[k]=String(f.get(k)||'').trim()});save();prof();$('#pf button').textContent='Saved ✓';return}
 if(e.target.id==='me'){e.preventDefault();const f=new FormData(e.target);S.me={name:String(f.get('name')).trim(),cls:String(f.get('cls')||'').trim()};save();render();return}
 e.preventDefault();const c=SEC[dk()],f=new FormData(e.target),o={id:uid()};

 Object.assign(o,c.d||{});if(dk()==='schools'&&o.cur)S.schools.forEach(y=>{y.cur=false});S[dk()].push(o);save();open=false;render()});
const lab=(k,x)=>{const d=document.createElement('div');d.innerHTML=SEC[k].row(x);const b=d.querySelector('b');return b?b.textContent.trim():'Entry'};
async function share(k){
 const c=SEC[k],it=S[k].slice();if(!it.length){alert('Add some entries first.');return}
 if(c.s)it.sort(c.s);const lines=[c.t+' - SPAD'];
 const one=x=>{const d=document.createElement('div');d.innerHTML=c.row(x);const b=d.querySelector('b'),h=d.querySelector('.chip'),s=[...d.querySelectorAll('small')].map(e=>e.textContent).join(' ');lines.push('- '+(b?b.textContent.trim():'')+(h?' ['+h.textContent+']':'')+(s?' ('+s+')':''))};
 if(c.days)c.days.forEach(day=>{const g=it.filter(x=>x.day===day);if(g.length){lines.push('',day+':');g.forEach(one)}});else it.forEach(one);
 const text=lines.join('\n');
 try{if(navigator.share){await navigator.share({title:c.t,text});return}}catch(e){if(e&&e.name==='AbortError')return}
 const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}t.remove();
 alert(ok?'Copied. Paste it into WhatsApp or a message.':'Sharing isn’t available here.')}
const ALL=['subjects','scores','ach','skills','acts','scheme','periods','academic','extra','study','mood','teachers','events','stuff','todo','bands','schools'];
async function pdf(keys){
 keys=keys.filter(k=>S[k].length);if(!keys.length){alert('Add some entries first, then export.');return}
 const dl={save:async({filename,data})=>{
  const blob=new Blob([data],{type:'application/pdf'});
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)&&navigator.canShare){const f=new File([blob],filename,{type:'application/pdf'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}};
 if(!window.jspdf){alert('The PDF tool didn’t load. Check your connection and try again.');return}
 const doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=48;let y=M;
 const cl=s=>String(s).replace(/[\u2018\u2019]/g,"'").replace(/[\u2013\u2014]/g,'-').replace(/\u00b7/g,'-').replace(/[^\x20-\x7E\xA0-\xFF]/g,'').trim();
 const put=(t,z,b,c,i)=>{i=i||0;doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(z);doc.setTextColor(...[].concat(c||0));doc.splitTextToSize(cl(t),W-2*M-i).forEach(l=>{if(y>H-M){doc.addPage();y=M}doc.text(l,M+i,y);y+=z*1.4})};
 put('SPAD - Student Progress Diary',20,1);put('Saved '+fmt(ld()),10,0,100);y+=6;
 keys.forEach(k=>{const c=SEC[k];let it=S[k].slice();if(c.s)it.sort(c.s);y+=12;put(c.t,15,1,[22,35,63]);
  const one=x=>{const d=document.createElement('div');d.innerHTML=c.row(x);const b=d.querySelector('b'),h=d.querySelector('.chip');put((b?b.textContent:'')+(h?'   ['+h.textContent+']':''),11,1,0,10);const s=[...d.querySelectorAll('small')].map(e=>e.textContent).join(' ');if(s)put(s,9.5,0,90,22);y+=3};
  if(c.days)c.days.forEach(day=>{const g=it.filter(x=>x.day===day);if(g.length){put(day,11,1,[166,90,46],4);g.forEach(one)}});else it.forEach(one)});
 try{await dl.save({filename:'SPAD-'+(keys.length>1?'diary':keys[0])+'-'+ld()+'.pdf',data:doc.output('arraybuffer')})}catch(e){if(!e||e.code!=='declined')alert('The PDF couldn’t be saved. Try again.')}}
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
